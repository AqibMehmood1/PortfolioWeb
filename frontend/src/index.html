  <script>
    (function () {
      try {
        // Clear old/stale cached data from previous versions to ensure canonical brand logo is always active
        var cached = localStorage.getItem('cached_site_favicon');
        if (cached && (cached.indexOf('data:image') === 0 || cached.indexOf('favicon.ico') !== -1 || cached.indexOf('assets/img/favicon.png') !== -1)) {
          localStorage.removeItem('cached_site_favicon');
          cached = null;
        }
        if (cached) {
          var f = document.getElementById('app-dynamic-favicon');
          if (f) { f.href = cached; }
        }
      } catch (e) { }
    })();
  </script>
