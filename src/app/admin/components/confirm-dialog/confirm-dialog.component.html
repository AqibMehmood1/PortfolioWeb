<div class="confirm-modal-backdrop" *ngIf="isOpen && dialogOptions" (click)="onCancel()">
  <div class="confirm-modal-container" (click)="$event.stopPropagation()" [ngClass]="dialogOptions.type || 'danger'">
    <!-- Top glowing accent strip -->
    <div class="confirm-modal-glow"></div>

    <div class="confirm-modal-inner">
      <!-- Glowing icon badge -->
      <div class="confirm-icon-wrap">
        <div class="confirm-icon-circle">
          <i [class]="dialogOptions.icon || (dialogOptions.type === 'warning' ? 'fas fa-exclamation-triangle' : (dialogOptions.type === 'info' ? 'fas fa-info-circle' : 'fas fa-trash-alt'))"></i>
        </div>
      </div>

      <!-- Text details -->
      <div class="confirm-body-wrap">
        <h3 class="confirm-title">{{ dialogOptions.title || 'Confirm Action' }}</h3>
        
        <p class="confirm-message">
          {{ dialogOptions.message }}
          <span class="confirm-highlight" *ngIf="dialogOptions.itemHighlight">
            {{ dialogOptions.itemHighlight }}
          </span>
        </p>

        <div class="confirm-warning-note" *ngIf="dialogOptions.type === 'danger' || !dialogOptions.type">
          <i class="fas fa-shield-alt"></i> This action is permanent and will remove the record immediately.
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="confirm-actions">
      <button type="button" class="btn-confirm-cancel" (click)="onCancel()">
        {{ dialogOptions.cancelText || 'Cancel' }}
      </button>

      <button type="button" class="btn-confirm-action" [ngClass]="dialogOptions.type || 'danger'" (click)="onConfirm()" autofocus>
        <i [class]="dialogOptions.type === 'danger' || !dialogOptions.type ? 'fas fa-trash-alt' : 'fas fa-check'"></i>
        <span>{{ dialogOptions.confirmText || 'Delete' }}</span>
      </button>
    </div>
  </div>
</div>
