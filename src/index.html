  <link id="app-dynamic-favicon-apple" rel="apple-touch-icon" href="assets/nexvoys/nex-fav.png">
  <script>
    (function() {
      try {
        var cached = localStorage.getItem('cached_site_favicon');
        if (cached) {
          var f = document.getElementById('app-dynamic-favicon');
          var s = document.getElementById('app-dynamic-favicon-shortcut');
          var a = document.getElementById('app-dynamic-favicon-apple');
          if (f) { f.type = 'image/png'; f.href = cached; }
          if (s) { s.type = 'image/png'; s.href = cached; }
          if (a) { a.href = cached; }
        }
      } catch (e) {}
    })();
  </script>
